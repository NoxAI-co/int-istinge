name: Deploy (Docker / flota de clientes)

# Cada push a master se despliega a la flota. deploy.sh prueba primero con un
# cliente canario y solo entonces toca al resto. NO se espera a los barridos
# del cron (WAIT_SCHEDULER=0, decisión del dueño 08-2026: un rollout no puede
# tardar 40 min por un barrido; si un corte queda a medias, el siguiente
# barrido del cron lo corrige).
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      client:
        description: 'Desplegar solo a este cliente (vacío = todos)'
        required: false
        default: ''
        type: string
      force:
        description: 'Desplegar aunque el scheduler esté en medio de un barrido'
        required: false
        default: false
        type: boolean

# Dos pushes seguidos no pueden desplegar en paralelo: se pisarían el build de
# la imagen y el recreado de contenedores. El segundo espera al primero.
concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -uo pipefail

          # Cada verificación falla con su propio mensaje. Los valores nunca se
          # imprimen (y GitHub los enmascararía igual): solo decimos cuál falta.
          faltan=""
          [ -n "${DEPLOY_SSH_KEY}" ] || faltan="${faltan} DEPLOY_SSH_KEY"
          [ -n "${DEPLOY_HOST}" ]    || faltan="${faltan} DEPLOY_HOST"
          [ -n "${DEPLOY_USER}" ]    || faltan="${faltan} DEPLOY_USER"
          [ -n "${DEPLOY_PATH}" ]    || faltan="${faltan} DEPLOY_PATH"
          if [ -n "$faltan" ]; then
            echo "::error::Secrets sin definir o vacíos:${faltan}"
            echo "Cargalos en Settings > Secrets and variables > Actions."
            exit 1
          fi

          PORT="${DEPLOY_PORT:-22}"
          echo "Puerto SSH: ${PORT}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # printf, no echo: preserva los saltos de línea de la clave tal cual.
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Valida el formato sin exponer nada: derivar la pública falla si la
          # clave está truncada, sin las líneas BEGIN/END o con saltos perdidos.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY no es una clave privada válida."
            echo "Pegá el archivo completo, con las líneas BEGIN/END y el salto final."
            exit 1
          fi
          echo "Clave privada: formato OK"

          # Sin 2>/dev/null: si falla queremos ver el motivo en el log.
          if ! ssh-keyscan -p "${PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts; then
            echo "::error::No se pudo leer la clave host del servidor en el puerto ${PORT}."
            echo "Revisá que DEPLOY_HOST sea solo el host o IP (sin https://, sin usuario@, sin puerto)."
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts quedó vacío: el servidor no respondió en el puerto ${PORT}."
            exit 1
          fi
          echo "Clave host del servidor: OK"

      - name: Desplegar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CANARY_CLIENT: ${{ vars.CANARY_CLIENT }}
          ONLY_CLIENT: ${{ github.event.inputs.client }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          echo "Commit: ${{ github.sha }}"
          echo "Autor:  ${{ github.actor }}"

          DEPLOY_PORT="${DEPLOY_PORT:-22}"

          # ServerAlive*: el rollout puede quedarse callado varios minutos
          # esperando a que termine el barrido del cron de un cliente. Sin
          # keepalive la conexión se corta ("broken pipe") y la flota queda a
          # medio desplegar. 30s x 20 = tolera hasta 10 min de silencio.
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && CANARY_CLIENT='${CANARY_CLIENT}' FORCE='${FORCE}' WAIT_SCHEDULER=0 ./deploy.sh ${ONLY_CLIENT}"

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Resumen
        if: always()
        run: |
          echo "=========================================="
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Desplegado  ${{ github.sha }}"
          else
            echo "❌ Falló el deploy de ${{ github.sha }}"
            echo ""
            echo "Si falló el canario, el resto de la flota NO fue tocada."
            echo "Rollback en el servidor:"
            echo "  IMAGE_TAG=<sha_anterior> SKIP_BUILD=1 ./deploy.sh"
          fi
          echo "=========================================="
