# ============================================================================
#  int-istinge — APP DE UN CLIENTE (un "proyecto" de compose por cliente).
#  Usa la MISMA imagen para todos; lo único distinto es el .env y el dominio.
#  NO publica puertos: el proxy Caddy lo alcanza por la red 'web'.
#
#  Variables requeridas al levantar:
#     CLIENT  -> nombre corto del cliente (ej. acme)  -> usa clientes/$CLIENT/.env
#     DOMAIN  -> dominio del cliente (ej. acme.com.co)
#
#  Opcional:
#     HESTIA_IP -> IP del servidor Hestia que sirve la raíz del dominio (la
#                  página web del cliente). Default: 13.140.155.227. Se puede
#                  sobreescribir por cliente con HESTIA_IP= en su .env.
#
#  Ejemplo (un cliente):
#     CLIENT=acme DOMAIN=acme.com.co \
#       docker compose -p acme -f docker-compose.client.yml up -d
#
#  Preferí siempre `./deploy.sh <cliente>` en vez de invocar compose a mano.
# ============================================================================

services:
  app:
    # Imagen única compartida (construida una vez). deploy.sh la etiqueta con el
    # commit desplegado; IMAGE_TAG permite volver a una anterior para rollback.
    image: "integra-int:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    env_file:
      # Falla ruidosamente si CLIENT no está set, en vez de intentar leer
      # clientes//.env y morir con un error confuso de "file not found".
      - "./clientes/${CLIENT:?falta CLIENT. Usá ./deploy.sh <cliente> o exportá CLIENT=<cliente> DOMAIN=<dominio> ASSET_URL=<url>}/.env"
    environment:
      # ASSET_URL lo computa ./deploy.sh (default = APP_URL; override desde
      # el .env si el cliente lo declara). 'environment:' tiene precedencia
      # sobre 'env_file:', así que el valor pasado por deploy.sh siempre gana.
      ASSET_URL: "${ASSET_URL:?falta ASSET_URL. Usá ./deploy.sh <cliente> (lo deriva de APP_URL automáticamente)}"
    labels:
      # Dominio del cliente: Caddy le emite el HTTPS (el DNS apunta acá, ACME funciona).
      caddy: "${DOMAIN:?falta DOMAIN. Usá ./deploy.sh <cliente> o exportá CLIENT=<cliente> DOMAIN=<dominio>}"

      # 0) /software -> la app Laravel. Igual que hoy: handle_path STRIPEA el prefijo.
      caddy.0_handle_path: /software*
      caddy.0_handle_path.reverse_proxy: "{{upstreams 80}}"

      # 1) Todo lo demás (la raíz) -> landing servida por Hestia, en HTTP plano.
      #    Caddy preserva el Host original por defecto, así Hestia matchea su vhost.
      #    OJO: en Hestia NO activar "Force SSL" (el HTTPS lo emite Caddy; forzarlo
      #    allá provocaría un loop de redirecciones).
      caddy.1_handle: /*
      caddy.1_handle.reverse_proxy: "${HESTIA_IP:-13.140.155.227}:80"

      # 2) Atajos viejos del portal de pagos -> /software/portal-pagos.
      #    redir corre antes que handle_path/handle en el orden default de Caddy,
      #    así que estos dispararán incluso con el handle /* presente.
      caddy.2_redir: /pay.php /software/portal-pagos 302
      caddy.3_redir: /pagos.php /software/portal-pagos 302
    networks:
      - web        # alcanzable por el proxy
      - internal   # alcanza a MySQL
    volumes:
      - storage:/var/www/html/storage/app     # archivos que sube/genera el cliente
      - adjuntos:/var/www/html/public/adjuntos
      - logs:/var/www/html/storage/logs        # logs persistentes (los lee el módulo de Logs)

networks:
  web:
    external: true
  internal:
    external: true

volumes:
  storage:
  adjuntos:
  logs:
